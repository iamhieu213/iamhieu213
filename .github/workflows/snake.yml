
name: Generate Custom Snake

on:
  push:
    branches:
      - main
    paths:
      - generate_snake.py
      - snake.svg
      - .github/workflows/snake.yml
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Snake Animation
        run: |
          python generate_snake.py
          mkdir -p dist
          cp snake.svg dist/snake.svg

      - name: Deploy Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
